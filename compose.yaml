services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ratecart
      POSTGRES_USER: ratecart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    volumes:
      - ratecart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratecart -d ratecart"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://ratecart:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}@postgres:5432/ratecart?sslmode=disable
      RATECART_API_KEYS: ${RATECART_API_KEYS:?Set RATECART_API_KEYS before starting}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  ratecart_data:
