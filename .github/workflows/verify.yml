name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ratecart_test
          POSTGRES_DB: ratecart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ratecart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          RATECART_TEST_DATABASE_URL: postgres://postgres:ratecart_test@localhost:5432/ratecart_test?sslmode=disable
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/server
