name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ratecart_test
          POSTGRES_DB: ratecart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ratecart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          RATECART_TEST_DATABASE_URL: postgres://postgres:ratecart_test@localhost:5432/ratecart_test?sslmode=disable
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/server

  container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ratecart-ci-only
      RATECART_API_KEYS: '[{"tenant_id":"ci","key":"0123456789abcdef0123456789abcdef"}]'
    steps:
      - uses: actions/checkout@v7
      - name: Build and start PostgreSQL-backed container
        run: docker compose up --build --wait --wait-timeout 120 -d
      - name: Check readiness and authenticated catalog route
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer 0123456789abcdef0123456789abcdef' \
            http://127.0.0.1:8080/products
      - name: Remove test containers and database
        if: always()
        run: docker compose down --volumes
